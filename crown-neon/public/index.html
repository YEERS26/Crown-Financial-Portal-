<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Crown — Financial Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --mah:       #1a0e07;
  --mah2:      #271507;
  --mah3:      #38200e;
  --mah4:      #4d2c12;
  --brass:     #c8911c;
  --brasslt:   #e8b84a;
  --brassdim:  #7a5610;
  --cream:     #f4edd8;
  --creamdim:  #ddd1b8;
  --parch:     #faf6ed;
  --ink:       #1a0e07;
  --inkm:      #56360f;
  --inkl:      #896530;
  --inkf:      #b89e60;
  --g:         #255c1f; --gbg:#eaf3e7; --gt:#1a4515;
  --a:         #7a4300; --abg:#fdf2df; --at:#5c3200;
  --r:         #781818; --rbg:#fdf0ef; --rt:#5c1010;
  --b:         #193c6e; --bbg:#eaf0fa; --bt:#112a52;
  --pub:       #f0edfe; --pubt:#3d2fa0;
  --ros:       #fdf0f6; --rost:#7a1f50;
  --bdr:       rgba(200,145,28,.22);
  --bdrlt:     rgba(200,145,28,.12);
  --sh1:       0 1px 4px rgba(26,14,7,.14);
  --sh2:       0 4px 16px rgba(26,14,7,.17);
  --sh3:       0 8px 32px rgba(26,14,7,.24);
  --serif:     'Playfair Display',Georgia,serif;
  --sans:      'DM Sans',system-ui,sans-serif;
  --rs:4px; --rm:8px; --rl:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:var(--sans);background:var(--parch);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
input,select,button,textarea{font-family:var(--sans)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;background:var(--mah);background-image:radial-gradient(ellipse 80% 60% at 15% 65%,rgba(200,145,28,.1) 0%,transparent 70%),radial-gradient(ellipse 60% 50% at 85% 20%,rgba(200,145,28,.08) 0%,transparent 60%)}
.lcrown{font-size:46px;margin-bottom:10px;filter:drop-shadow(0 2px 12px rgba(200,145,28,.55))}
.ltitle{font-family:var(--serif);font-size:34px;color:var(--brasslt);letter-spacing:.02em;margin-bottom:3px}
.lsub{font-size:11px;font-weight:300;letter-spacing:.2em;text-transform:uppercase;color:var(--inkf);margin-bottom:36px}
.lcard{background:var(--mah2);border:1px solid var(--bdr);border-radius:var(--rl);padding:2rem;width:100%;max-width:340px;box-shadow:var(--sh3),inset 0 1px 0 rgba(200,145,28,.12)}
.lcard h2{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--cream);margin-bottom:1.5rem}
.fld{margin-bottom:1.1rem}
.fld label{display:block;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--inkf);margin-bottom:5px}
.fld input{width:100%;padding:9px 12px;background:var(--mah);border:1px solid rgba(200,145,28,.22);border-radius:var(--rs);font-size:13px;color:var(--cream);outline:none;transition:border-color .15s}
.fld input:focus{border-color:var(--brass)}
.fld input::placeholder{color:var(--inkl)}
.lerr{font-size:12px;color:#e07070;min-height:16px;margin-bottom:8px}
.btnlogin{width:100%;padding:10px;background:var(--brass);color:var(--mah);border:none;border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s}
.btnlogin:hover{background:var(--brasslt)}
.btnlogin:active{transform:translateY(1px)}
.lhint{font-size:11px;color:var(--inkl);text-align:center;margin-top:12px}

/* SHELL */
#app{display:none;flex-direction:column;min-height:100vh}
.hdr{background:var(--mah);border-bottom:1px solid var(--bdr);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:200;box-shadow:var(--sh1)}
.hbrand{display:flex;align-items:center;gap:10px}
.hcrown{font-size:20px}
.hname{font-family:var(--serif);font-size:17px;color:var(--brasslt)}
.hlabel{font-size:10px;font-weight:300;letter-spacing:.14em;text-transform:uppercase;color:var(--inkf)}
.hright{display:flex;align-items:center;gap:14px}
.syncpill{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--inkf)}
.sdot{width:6px;height:6px;border-radius:50%;background:#4caf50;flex-shrink:0}
.sdot.sv{background:var(--brass);animation:pulse 1s infinite}
.sdot.er{background:#e07070}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btnso{font-size:12px;color:var(--inkf);background:transparent;border:1px solid rgba(200,145,28,.22);border-radius:var(--rs);padding:4px 12px;cursor:pointer;transition:color .15s,border-color .15s}
.btnso:hover{color:#e07070;border-color:rgba(224,112,112,.4)}
.tabs{background:var(--mah2);border-bottom:1px solid var(--bdr);padding:0 20px;display:flex;overflow-x:auto}
.tab{padding:13px 16px;font-size:13px;color:var(--inkf);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover{color:var(--creamdim)}
.tab.active{color:var(--brasslt);border-bottom-color:var(--brass);font-weight:500}
.content{padding:20px;max-width:1300px;margin:0 auto;width:100%}

/* METRICS */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.mcard{background:#fff;border:1px solid var(--bdrlt);border-radius:var(--rm);padding:15px;box-shadow:var(--sh1);position:relative;overflow:hidden}
.mcard::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brass),var(--brasslt))}
.mlbl{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--inkl);margin-bottom:6px}
.mval{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--ink)}
.mval.danger{color:var(--r)} .mval.success{color:var(--g)} .mval.warning{color:var(--a)} .mval.info{color:var(--b)}
.msub{font-size:11px;color:var(--inkl);margin-top:3px}

/* CARDS */
.card{background:#fff;border:1px solid var(--bdrlt);border-radius:var(--rl);box-shadow:var(--sh1);overflow:hidden;margin-bottom:16px}
.chead{padding:12px 16px;border-bottom:1px solid var(--bdrlt);display:flex;align-items:center;justify-content:space-between;background:var(--parch)}
.ctitle{font-family:var(--serif);font-size:14px;color:var(--ink)}
.cbody{padding:0}

/* DASHBOARD GRID */
.dgrid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.dgrid3{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:760px){.dgrid2,.dgrid3{grid-template-columns:1fr}}
.srow{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-bottom:1px solid var(--bdrlt);font-size:13px}
.srow:last-child{border-bottom:none}
.slbl{color:var(--inkl)} .sval{font-weight:600}

/* ALERT */
.alert{display:flex;align-items:flex-start;gap:9px;background:#fdf3f3;border:1px solid rgba(120,24,24,.2);border-radius:var(--rm);padding:10px 14px;font-size:13px;color:var(--r);margin-bottom:16px}

/* NOTICE BAR */
.notice{display:flex;align-items:center;justify-content:space-between;background:var(--bbg);border:1px solid rgba(25,60,110,.18);border-radius:var(--rm);padding:9px 14px;margin-bottom:14px;font-size:13px;color:var(--bt)}
.btnsave{padding:5px 14px;font-size:12px;font-weight:600;background:var(--b);color:#fff;border:none;border-radius:var(--rs);cursor:pointer}
.btnsave:hover{background:#0f2849}

/* FILTER ROW */
.frow{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.frow select,.frow input[type=text]{font-size:13px;padding:6px 10px;border:1px solid #d8ccb0;border-radius:var(--rs);background:#fff;color:var(--ink);outline:none;transition:border-color .15s}
.frow select:focus,.frow input:focus{border-color:var(--brass)}
.btnprimary{padding:6px 14px;font-size:12px;font-weight:600;background:var(--brass);color:var(--mah);border:none;border-radius:var(--rs);cursor:pointer;transition:background .15s}
.btnprimary:hover{background:var(--brasslt)}
.btnsm{padding:5px 10px;font-size:12px;border:1px solid #d8ccb0;border-radius:var(--rs);background:#fff;color:var(--ink);cursor:pointer}
.btnsm:hover{background:var(--parch)}
.btndanger{background:var(--rbg);color:var(--rt);border-color:rgba(120,24,24,.2)}
.btndanger:hover{background:#fce0e0}

/* TABLE */
.twrap{overflow-x:auto;border:1px solid var(--bdrlt);border-radius:var(--rl);box-shadow:var(--sh1)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px;background:#fff}
thead{background:var(--parch)}
th{padding:9px 11px;text-align:left;font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--inkl);border-bottom:1px solid var(--bdrlt);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid rgba(200,145,28,.07);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(200,145,28,.03)}
.totalrow td{font-weight:600;border-top:2px solid var(--bdr);background:var(--parch)!important}

/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.bpaid{background:var(--gbg);color:var(--gt)} .btopay{background:var(--abg);color:var(--at)} .bna{background:#f0ece2;color:var(--inkl)}
.burgent{background:var(--rbg);color:var(--rt)} .bhigh{background:var(--abg);color:var(--at)} .blow{background:#f0ece2;color:var(--inkl)}
.bweekly{background:var(--bbg);color:var(--bt)} .bmonthly{background:var(--pub);color:var(--pubt)} .byearly{background:var(--ros);color:var(--rost)}
.cattag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;background:#f0ece2;color:var(--inkl);border:1px solid rgba(200,145,28,.15)}

/* EDITABLE */
.enum{width:90px;padding:3px 7px;text-align:right;border:1px solid transparent;border-radius:var(--rs);font-size:13px;color:var(--ink);background:transparent;transition:border-color .15s,background .15s;outline:none}
.enum:hover{border-color:#d8ccb0;background:#fff}
.enum:focus{border-color:var(--brass);background:#fff}
.esel{padding:4px 6px;font-size:12px;border:1px solid #d8ccb0;border-radius:var(--rs);background:#fff;color:var(--ink);cursor:pointer;outline:none}
.esel:focus{border-color:var(--brass)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(26,14,7,.65);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:var(--rl);box-shadow:var(--sh3);width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.mhead{padding:16px 20px;border-bottom:1px solid var(--bdrlt);display:flex;align-items:center;justify-content:space-between;background:var(--parch)}
.mhead h3{font-family:var(--serif);font-size:16px}
.mclose{background:none;border:none;font-size:20px;cursor:pointer;color:var(--inkl);line-height:1}
.mclose:hover{color:var(--r)}
.mbody{padding:20px}
.mfld{margin-bottom:14px}
.mfld label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--inkl);margin-bottom:5px}
.mfld input,.mfld select,.mfld textarea{width:100%;padding:8px 10px;border:1px solid #d8ccb0;border-radius:var(--rs);font-size:13px;color:var(--ink);background:#fff;outline:none;transition:border-color .15s}
.mfld input:focus,.mfld select:focus{border-color:var(--brass)}
.mfooter{padding:14px 20px;border-top:1px solid var(--bdrlt);display:flex;justify-content:flex-end;gap:8px;background:var(--parch)}
.mgrid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* CALENDAR */
.cal-wrap{padding:16px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-title{font-family:var(--serif);font-size:16px;font-weight:700}
.cal-nav button{background:none;border:1px solid var(--bdrlt);border-radius:var(--rs);padding:4px 10px;cursor:pointer;font-size:13px;color:var(--inkl)}
.cal-nav button:hover{background:var(--parch)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-daylbl{text-align:center;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--inkl);padding:4px 0}
.cal-day{min-height:70px;background:#fff;border:1px solid var(--bdrlt);border-radius:var(--rs);padding:5px;cursor:default;transition:background .1s}
.cal-day.today{border-color:var(--brass);background:#fffbf0}
.cal-day.othermonth{background:var(--parch);opacity:.5}
.cal-day.haspay{cursor:pointer}
.cal-day.haspay:hover{background:#fffbef}
.cal-daynum{font-size:11px;font-weight:600;color:var(--inkl);margin-bottom:3px}
.cal-day.today .cal-daynum{color:var(--brass);font-weight:700}
.cal-pip{font-size:10px;padding:1px 5px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-pip.paid{background:var(--gbg);color:var(--gt)}
.cal-pip.topay{background:var(--abg);color:var(--at)}
.cal-pip.future{background:var(--bbg);color:var(--bt)}
.cal-legend{display:flex;gap:14px;margin-top:12px;font-size:11px;align-items:center;flex-wrap:wrap}
.cal-legend span{display:flex;align-items:center;gap:4px}
.cal-dot{width:8px;height:8px;border-radius:2px;display:inline-block}

/* CHART CONTAINERS */
.chartbox{padding:16px;position:relative;height:220px}

/* CREDIT BAR */
.crwrap{display:flex;align-items:center;gap:8px}
.crbar{flex:1;height:5px;background:#f0ece2;border-radius:3px;overflow:hidden;min-width:40px}
.crfill{height:100%;border-radius:3px;background:var(--r)}

/* WEEKLY SCHEDULE BADGE */
.wkbadge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;background:#e8f4fe;color:#193c6e;margin:1px}

.hint{font-size:12px;color:var(--inkl);margin-bottom:12px}
.section-gap{margin-bottom:16px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="lcrown">👑</div>
  <div class="ltitle">The Crown</div>
  <div class="lsub">Financial Portal</div>
  <div class="lcard">
    <h2>Sign in</h2>
    <div class="fld"><label>Username</label><input type="text" id="lu" placeholder="chris" autocomplete="off"/></div>
    <div class="fld"><label>Password</label><input type="password" id="lp" placeholder="••••••••"/></div>
    <div class="lerr" id="lerr"></div>
    <button class="btnlogin" onclick="login()">Sign in</button>
    <p class="lhint">The Crown · Kingston upon Hull</p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="hdr">
    <div class="hbrand">
      <span class="hcrown">👑</span>
      <div><div class="hname">The Crown</div><div class="hlabel">Financial Portal</div></div>
    </div>
    <div class="hright">
      <div class="syncpill"><div class="sdot" id="sdot"></div><span id="stxt">All changes saved</span></div>
      <button class="btnso" onclick="logout()">Sign out</button>
    </div>
  </header>
  <nav class="tabs">
    <div class="tab active" onclick="go('dashboard',this)">Dashboard</div>
    <div class="tab" onclick="go('payments',this)">Payments</div>
    <div class="tab" onclick="go('pricelist',this)">Price list</div>
    <div class="tab" onclick="go('credits',this)">Credit tracker</div>
  </nav>
  <div class="content" id="tc"></div>
</div>

<!-- MODAL -->
<div class="overlay" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal" id="modalBox">
    <div class="mhead"><h3 id="modalTitle">Payment</h3><button class="mclose" onclick="hideModal()">×</button></div>
    <div class="mbody" id="modalBody"></div>
    <div class="mfooter" id="modalFooter"></div>
  </div>
</div>

const fmt = n=>(n==null)?'—':'\u00a3'+Number(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const today = ()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const todayStr = today();

function defById(id){ return defs.find(d=>d.id===id); }
function instsByDef(defId){ return insts.filter(i=>i.defId===defId); }

function toMonthly(def){
  if(def.freq==='Weekly')  return def.amount*52/12;
  if(def.freq==='Monthly') return def.amount;
  if(def.freq==='One-off') return 0; // one-offs don't count toward monthly recurring
  return def.amount/12;
}

function freqBadge(f){
  if(f==='Weekly')  return `<span class="badge bweekly">Weekly</span>`;
  if(f==='Monthly') return `<span class="badge bmonthly">Monthly</span>`;
  if(f==='Yearly')  return `<span class="badge byearly">Yearly</span>`;
  if(f==='One-off') return `<span class="badge" style="background:#f0f9e8;color:#2d6a0a;border:1px solid rgba(45,106,10,.2)">One-off</span>`;
  return f;
}
function statusBadge(s){
  if(s==='Paid') return `<span class="badge bpaid">Paid</span>`;
  if(s==='To be paid') return `<span class="badge btopay">To pay</span>`;
  return `<span class="badge bna">—</span>`;
}
function priBadge(p){
  if(p==='Urgent') return `<span class="badge burgent">Urgent</span>`;
  if(p==='High') return `<span class="badge bhigh">High</span>`;
  if(p==='Low') return `<span class="badge blow">Low</span>`;
  return '—';
}

function nextOccurrence(def){
  const now=new Date(); now.setHours(0,0,0,0);
  if(def.freq==='Weekly'){
    const wdMap={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
    const target=wdMap[def.weekday];
    const d=new Date(now);
    let diff=(target-d.getDay()+7)%7;
    if(diff===0) diff=7;
    d.setDate(d.getDate()+diff);
    return d;
  }
  if(def.freq==='Monthly'){
    const d=new Date(now.getFullYear(),now.getMonth(),def.dayOfMonth||1);
    if(d<=now) d.setMonth(d.getMonth()+1);
    return d;
  }
  if(def.nextDate){
    const p=def.nextDate.split('-');
    return new Date(+p[0],+p[1]-1,+p[2]);
  }
  return null;
}

function formatDate(d){
  if(!d) return '—';
  if(typeof d==='string') d=new Date(d.replace(/-/g,'/'));
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}

// Count how many times a weekly payment hits in the current calendar month
function weeklyCountInMonth(weekday, y, m){
  const wdMap={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  const target=wdMap[weekday];
  let count=0;
  const days=new Date(y,m+1,0).getDate();
  for(let d=1;d<=days;d++){
    if(new Date(y,m,d).getDay()===target) count++;
  }
  return count;
}

/* ============================================================
   AUTO-GENERATE INSTANCES for next 8 weeks
   ============================================================ */
function generateUpcomingInstances(){
  const now=new Date(); now.setHours(0,0,0,0);
  const horizon=new Date(now); horizon.setDate(horizon.getDate()+56);
  defs.forEach(def=>{
    if(def.freq==='Weekly'&&def.weekday){
      const wdMap={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
      const target=wdMap[def.weekday];
      for(let d=new Date(now);d<=horizon;d.setDate(d.getDate()+1)){
        if(d.getDay()===target){
          const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
          if(!insts.find(i=>i.defId===def.id&&i.date===ds)){
            insts.push({id:nextInstId++,defId:def.id,date:ds,amount:def.amount,status:''});
          }
        }
      }
    }
    if(def.freq==='Monthly'&&def.dayOfMonth){
      for(let offset=0;offset<=3;offset++){
        const d=new Date(now.getFullYear(),now.getMonth()+offset,def.dayOfMonth);
        const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        if(!insts.find(i=>i.defId===def.id&&i.date===ds)){
          insts.push({id:nextInstId++,defId:def.id,date:ds,amount:def.amount,status:''});
        }
      }
    }
  });
}

function _renderBreakdown(filtered){
  const body=document.getElementById('breakdownBody');
  const total=document.getElementById('breakdownTotal');
  const count=document.getElementById('breakdownCount');
  const title=document.getElementById('breakdownTitle');
  if(!body) return;
  const sum=filtered.reduce((s,i)=>s+i.amount,0);
  body.innerHTML=filtered.map(i=>{
    const def=defById(i.defId); if(!def) return '';
    return `<tr>
      <td style="font-size:12px;color:var(--inkl)">${formatDate(i.date)}</td>
      <td style="font-weight:600">${def.name}</td>
      <td><span class="cattag">${def.cat}</span></td>

      <td style="text-align:right;font-weight:600">${fmt(i.amount)}</td>
      <td>${statusBadge(i.status)}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--inkl)">No payments in this category.</td></tr>`;
  if(total) total.textContent = fmt(sum);
  if(count) count.textContent = `${filtered.length} payments · ${fmt(sum)}`;
  if(title && _activeCatFilter) title.textContent = _activeCatFilter + ' — ' + new Date().toLocaleString('en-GB',{month:'long',year:'numeric'});

}

          const isPaid=els[0].index===0;
          _activeCatFilter=null;
          const filtered=monthInsts.filter(i=>isPaid?i.status==='Paid':i.status!=='Paid').sort((a,b)=>a.date.localeCompare(b.date));
          _renderBreakdown(filtered);
          const bt=document.getElementById('breakdownTable');
          if(bt) bt.closest('.card').scrollIntoView({behavior:'smooth',block:'start'});
        }
      }
    });
  }
}

/* ============================================================
   CALENDAR
   ============================================================ */
function renderCalendar(y,m){
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const daysInPrev=new Date(y,m,0).getDate();
  const todayDate=new Date(); todayDate.setHours(0,0,0,0);

  // Group instances by date string
  const byDate={};
  insts.forEach(i=>{
    const d=new Date(i.date.replace(/-/g,'/'));
    if(d.getFullYear()===y&&d.getMonth()===m){
      if(!byDate[i.date]) byDate[i.date]=[];
      const def=defById(i.defId);
      if(def) byDate[i.date].push({name:def.name,amount:i.amount,status:i.status,instId:i.id});
    }
  });

  const offset=(firstDay+6)%7; // Mon start
  let cells='';

  // Prev month fillers
  for(let i=0;i<offset;i++){
    cells+=`<div class="cal-day othermonth"><div class="cal-daynum">${daysInPrev-offset+i+1}</div></div>`;
  }

  for(let d=1;d<=daysInMonth;d++){
    const dd=new Date(y,m,d);
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=dd.getTime()===todayDate.getTime();
    const pips=byDate[ds]||[];
    const cls=['cal-day', isToday?'today':'', pips.length?'haspay':''].filter(Boolean).join(' ');
    const pipHtml=pips.slice(0,3).map(p=>{
      let pc='future';
      if(p.status==='Paid') pc='paid';
      else if(p.status==='To be paid') pc='topay';
      return `<div class="cal-pip ${pc}" title="${p.name}: £${p.amount.toFixed(2)}">${p.name.split(' ')[0]}</div>`;
    }).join('');
    const extra=pips.length>3?`<div style="font-size:10px;color:var(--inkl)">+${pips.length-3} more</div>`:'';
    const onclick=pips.length?`onclick="showCalDay('${ds}')"` : '';
    cells+=`<div class="${cls}" ${onclick}><div class="cal-daynum">${d}</div>${pipHtml}${extra}</div>`;
  }

  // Next month fillers
  const totalCells=Math.ceil((offset+daysInMonth)/7)*7;
  for(let i=1;i<=totalCells-(offset+daysInMonth);i++){
    cells+=`<div class="cal-day othermonth"><div class="cal-daynum">${i}</div></div>`;
  }

  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `
    <div class="cal-wrap">
      <div class="cal-nav">
        <button onclick="changeCalMonth(-1)">‹ Prev</button>
        <span class="cal-title">${monthNames[m]} ${y}</span>
        <button onclick="changeCalMonth(1)">Next ›</button>
      </div>
      <div class="cal-grid">
        ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cal-daylbl">${d}</div>`).join('')}
        ${cells}
      </div>
      <div class="cal-legend">
        <span><span class="cal-dot" style="background:var(--gbg);border:1px solid var(--gt)"></span>Paid</span>
        <span><span class="cal-dot" style="background:var(--abg);border:1px solid var(--at)"></span>To pay</span>
        <span><span class="cal-dot" style="background:var(--bbg);border:1px solid var(--bt)"></span>Upcoming</span>
      </div>
    </div>`;
}

function changeCalMonth(dir){
  calMonth.m+=dir;
  if(calMonth.m>11){calMonth.m=0;calMonth.y++;}
  if(calMonth.m<0){calMonth.m=11;calMonth.y--;}
  const c=document.getElementById('calContainer');
  if(c) c.innerHTML=renderCalendar(calMonth.y,calMonth.m);
}

// Initialise calMonth to current
(function(){const n=new Date();calMonth={y:n.getFullYear(),m:n.getMonth()};})();

function showCalDay(ds){
  const dayInsts=insts.filter(i=>i.date===ds);
  if(!dayInsts.length) return;
  const d=new Date(ds.replace(/-/g,'/'));
  const title=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const total=dayInsts.reduce((s,i)=>s+i.amount,0);
  const rows=dayInsts.map(i=>{
    const def=defById(i.defId);
    return `<tr>
      <td style="font-weight:600">${def?def.name:i.defId}</td>
      <td>${statusBadge(i.status)}</td>
      <td style="text-align:right;font-weight:600">${fmt(i.amount)}</td>
      <td>
        <select class="esel" onchange="updateInstStatus(${i.id},this.value)">
          <option value="" ${i.status===''?'selected':''}>—</option>
          <option value="Paid" ${i.status==='Paid'?'selected':''}>Paid</option>
          <option value="To be paid" ${i.status==='To be paid'?'selected':''}>To be paid</option>
        </select>
      </td>
    </tr>`;
  }).join('');
  showModal(title,`
    <p class="hint" style="margin-bottom:12px">Click status to update. Changes save automatically.</p>
    <div class="twrap"><table>
      <thead><tr><th>Payment</th><th>Status</th><th style="text-align:right">Amount</th><th>Update</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr class="totalrow"><td colspan="2">Day total</td><td style="text-align:right">${fmt(total)}</td><td></td></tr></tfoot>
    </table></div>`,
    `<button class="btnsm" onclick="hideModal()">Close</button>`
  );
}

function attachPayFilters(){
  const run=()=>{
    const cat=document.getElementById('fCat').value;
    const st=document.getElementById('fStat').value;
    const fr=document.getElementById('fFreq').value;
    const q=document.getElementById('fQ').value.toLowerCase();
    // For status filter we look at most recent instance
    const filtered=defs.filter(d=>{
      if(cat&&d.cat!==cat) return false;
      if(fr&&d.freq!==fr) return false;
      if(q&&!d.name.toLowerCase().includes(q)&&!d.cat.toLowerCase().includes(q)) return false;
      if(st){
        const latest=insts.filter(i=>i.defId===d.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
        if(!latest||latest.status!==st) return false;
      }
      return true;
    });
    document.getElementById('payBody').innerHTML=payRows(filtered);
  };
  ['fCat','fStat','fFreq','fQ'].forEach(id=>{
    document.getElementById(id).addEventListener('change',run);
    document.getElementById(id).addEventListener('input',run);
  });
  run();
}

}

let plDirty=false;
function attachPlEvents(){ plDirty=false; }

// Cascade a new amount to all future unpaid instances for a given definition
function cascadeAmount(defId, newAmount){
  const today = todayStr;
  insts.forEach(i=>{
    if(i.defId===defId && i.status!=='Paid' && i.date>=today){
      i.amount=newAmount;
    }
  });
}

function plChange(el){
  const def=defs.find(d=>d.id===+el.dataset.id); if(!def) return;
  const f=el.dataset.f;
  if(f==='amount'){
    def.amount=parseFloat(el.value)||0;
    cascadeAmount(def.id, def.amount); // sync all future unpaid instances
  }
  else if(f==='cat') def.cat=el.value;
  else if(f==='priority') def.priority=el.value;
  else if(f==='weekday') def.weekday=el.value;
  else if(f==='dayOfMonth') def.dayOfMonth=parseInt(el.value)||1;
  else if(f==='nextDate') def.nextDate=el.value;
  showPlNotice();
}

function plFreqChange(el){
  const def=defs.find(d=>d.id===+el.dataset.id); if(!def) return;
  def.freq=el.value;
  if(el.value==='Weekly'&&!def.weekday) def.weekday='Mon';
  if(el.value==='Monthly'&&!def.dayOfMonth) def.dayOfMonth=1;
  // Remove old future unpaid instances — they'll be regenerated with correct schedule
  const today=todayStr;
  insts=insts.filter(i=>!(i.defId===def.id && i.status!=='Paid' && i.date>=today));
  generateUpcomingInstances();
  document.getElementById(`dayCell_${def.id}`).innerHTML=renderDayCell(def);
  showPlNotice();
}

function plStatusChange(el){
  const def=defs.find(d=>d.id===+el.dataset.id); if(!def) return;
  // Update the most recent instance's status
  const inst=insts.filter(i=>i.defId===def.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(inst) inst.status=el.value;
  showPlNotice();
}

function showPlNotice(){ plDirty=true; const n=document.getElementById('plNotice'); if(n) n.style.display='flex'; }

function savePl(){
  save();
  const n=document.getElementById('plNotice'); if(n) n.style.display='none';
  plDirty=false;
}

    nextDate:(freq==='Yearly'||freq==='One-off')?dayVal||null:null,

  const oldFreq=def.freq;
  def.name=document.getElementById('eName').value.trim()||def.name;
  def.cat=document.getElementById('eCat').value;
  def.freq=document.getElementById('eFreq').value;
  const newAmount=parseFloat(document.getElementById('eAmt').value)||0;
  const amountChanged=newAmount!==def.amount;
  def.amount=newAmount;
  def.priority=document.getElementById('ePri').value;
  const cr=document.getElementById('eCredit').value;
  def.creditBal=cr!==''?parseFloat(cr):null;
  if(def.freq==='Weekly') def.weekday=document.getElementById('eDay').value;
  else if(def.freq==='Monthly') def.dayOfMonth=parseInt(document.getElementById('eDay').value)||1;
  else def.nextDate=document.getElementById('eDateInp').value||null;
  // Cascade new amount to all future unpaid instances
  if(amountChanged) cascadeAmount(def.id, def.amount);
  // If frequency changed, drop old future unpaid instances and regenerate
  if(oldFreq!==def.freq){
    const today=todayStr;
    insts=insts.filter(i=>!(i.defId===def.id && i.status!=='Paid' && i.date>=today));
    generateUpcomingInstances();
  }
  save();
  hideModal();
  render(activeTab);
}

function confirmDelete(id){
  const def=defs.find(d=>d.id===id); if(!def) return;
  showModal(`Delete — ${def.name}`,
    `<p style="font-size:14px;line-height:1.6">Are you sure you want to delete <strong>${def.name}</strong> and all its payment history?<br/><br/><span style="color:var(--r)">This cannot be undone.</span></p>`,
    `<button class="btnsm" onclick="hideModal()">Cancel</button>
     <button class="btnsm btndanger" onclick="doDelete(${id})">Yes, delete</button>`
  );
}

function doDelete(id){
  defs=defs.filter(d=>d.id!==id);
  insts=insts.filter(i=>i.defId!==id);
  save();
  hideModal();
  render(activeTab);
}

/* ============================================================
   CREDIT TRACKER
   ============================================================ */
function renderCredits(){
  const withCredit=defs.filter(d=>d.creditBal!==null&&d.creditBal!==undefined);
  const totalCred=withCredit.reduce((s,d)=>s+(d.creditBal||0),0);
  const maxCred=Math.max(...withCredit.map(d=>d.creditBal||0),1);

  return `
    <div class="mgrid" style="margin-bottom:16px">
      <div class="mcard"><div class="mlbl">Total credit remaining</div><div class="mval danger">${fmt(totalCred)}</div></div>
      <div class="mcard"><div class="mlbl">Accounts with balance</div><div class="mval">${withCredit.filter(d=>d.creditBal>0).length}</div></div>
    </div>
    <div id="crNotice" class="notice" style="display:none">
      <span>You have unsaved changes</span>
      <button class="btnsave" onclick="saveCr()">Save to session</button>
    </div>
    <p class="hint">Update the remaining credit balance after each payment deduction. Months remaining is calculated automatically.</p>
    <div class="twrap">
      <table>
        <thead><tr>
          <th>Payment</th><th>Category</th><th>Freq.</th>
          <th style="text-align:right">Per payment</th>
          <th style="text-align:right">Monthly equiv.</th>
          <th style="text-align:right">Remaining balance (£)</th>
          <th style="text-align:right">Est. months left</th>
        </tr></thead>
        <tbody id="crBody">
          ${defs.map(def=>{
            const mo=toMonthly(def);
            const left=(def.creditBal&&mo)?Math.ceil(def.creditBal/mo):null;
            const pct=def.creditBal&&def.creditMax?Math.min(100,(def.creditBal/def.creditMax)*100):0;
            return `<tr>
              <td style="font-weight:600">${def.name}</td>
              <td><span class="cattag">${def.cat}</span></td>
              <td>${freqBadge(def.freq)}</td>
              <td style="text-align:right">${fmt(def.amount)}</td>
              <td style="text-align:right;color:var(--inkl)">${fmt(mo)}</td>
              <td style="text-align:right">
                ${def.creditBal!==null?`
                  <div class="crwrap">
                    <div class="crbar"><div class="crfill" style="width:${pct}%"></div></div>
                    <input class="enum" type="number" step="0.01" min="0"
                      value="${def.creditBal||0}" data-id="${def.id}" style="width:90px"/>
                  </div>`
                :'<span style="color:var(--inkf);font-size:12px">n/a</span>'}
              </td>
              <td style="text-align:right;color:var(--inkl);font-size:12px">${left?left+' mo':'—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
        <tfoot><tr class="totalrow">
          <td colspan="5">Total credit remaining</td>
          <td style="text-align:right">${fmt(totalCred)}</td>
          <td></td>
        </tr></tfoot>
      </table>
    </div>`;
}

function attachCrEvents(){
  document.querySelectorAll('#crBody input.enum').forEach(inp=>{
    inp.addEventListener('change',e=>{
      const def=defs.find(d=>d.id===+e.target.dataset.id);
      if(def){def.creditBal=parseFloat(e.target.value)||0;const n=document.getElementById('crNotice');if(n)n.style.display='flex';}
    });
  });
}

function saveCr(){
  save();
  const n=document.getElementById('crNotice');if(n)n.style.display='none';
  render('credits');
  document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('active',t.textContent.includes('Credit'));});
  attachCrEvents();
  const n2=document.getElementById('crNotice');if(n2)n2.style.display='none';
}

/* ============================================================
   MODAL HELPERS
   ============================================================ */
function showModal(title,body,footer){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=body;
  document.getElementById('modalFooter').innerHTML=footer||'';
  document.getElementById('modal').style.display='flex';
}
function hideModal(){ document.getElementById('modal').style.display='none'; }
function closeModal(e){ if(e.target===document.getElementById('modal')) hideModal(); }
</script>
</body>
</html>
