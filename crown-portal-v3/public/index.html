<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Crown — Financial Portal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="styles/main.css"/>
</head>
<body>
  <!-- LOGIN -->
  <div id="loginScreen">
    <div class="lcrown">👑</div>
    <div class="ltitle">The Crown</div>
    <div class="lsub">Financial Portal</div>
    <div class="lcard">
      <h2>Sign in</h2>
      <div class="fld"><label>Email</label><input type="email" id="lu" placeholder="chris@thecrown.pub" autocomplete="username"/></div>
      <div class="fld"><label>Password</label><input type="password" id="lp" placeholder="••••••••" autocomplete="current-password"/></div>
      <div class="lerr" id="lerr"></div>
      <button class="btnlogin" id="loginBtn" onclick="login()">Sign in</button>
      <p class="lhint">The Crown · Kingston upon Hull</p>
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <header class="hdr">
      <div class="hbrand">
        <span class="hcrown">👑</span>
        <div><div class="hname">The Crown</div><div class="hlabel">Financial Portal</div></div>
      </div>
      <div class="hright">
        <div class="syncpill"><div class="sdot" id="sdot"></div><span id="stxt">Connected</span></div>
        <button class="btnso" onclick="logout()">Sign out</button>
      </div>
    </header>
    <nav class="tabs">
      <div class="tab active" onclick="go('dashboard',this)">Dashboard</div>
      <div class="tab" onclick="go('payments',this)">Payments</div>
      <div class="tab" onclick="go('pricelist',this)">Price list</div>
      <div class="tab" onclick="go('credits',this)">Credit tracker</div>
    </nav>
    <div class="content" id="tc"></div>
  </div>

  <!-- MODAL -->
  <div class="overlay" id="modal" style="display:none" onclick="closeModal(event)">
    <div class="modal" id="modalBox">
      <div class="mhead"><h3 id="modalTitle">Payment</h3><button class="mclose" onclick="hideModal()">×</button></div>
      <div class="mbody" id="modalBody"></div>
      <div class="mfooter" id="modalFooter"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
